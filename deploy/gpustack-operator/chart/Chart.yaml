apiVersion: v2
name: gpustack-operator
description: A Kubernetes operator that turns raw node hardware into a Kueue-based scheduling chain for accelerators (GPU/NPU/TPU), built on Node Feature Discovery (NFD) and Kueue.
type: application
# 打包时同步设置 version 和 appVersion，默认镜像标签使用 v 加 appVersion。
version: 0.0.0
appVersion: dev
kubeVersion: ">=1.23.0-0"
home: https://github.com/gpustack/gpustack-operator
sources:
  - https://github.com/gpustack/gpustack
  - https://github.com/gpustack/gpustack-operator
keywords:
  - gpustack-operator
  - operator
  - kueue
  - node-feature-discovery
  - gpu
  - npu
  - accelerator
maintainers:
  - name: GPUStack Authors
    url: https://github.com/gpustack
icon: https://raw.githubusercontent.com/gpustack/gpustack/main/docs/assets/logo.png
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
# charts/ 中已随附打过项目补丁的依赖包，因此 repository 留空。必须在这里声明依赖，Helm 才会按各自的 condition 决定是否渲染。
dependencies:
  - name: kueue
    version: 0.18.11
    repository: ""
    condition: kueue.enabled
  - name: node-feature-discovery
    version: 0.19.0
    repository: ""
    condition: node-feature-discovery.enabled
  - name: csi-driver-nfs
    version: 4.13.4
    repository: ""
    condition: csi-driver-nfs.enabled
  - name: csi-driver-s3
    version: 0.43.7
    repository: ""
    condition: csi-driver-s3.enabled
  - name: topograph
    version: 1.0.0
    repository: ""
    condition: topograph.enabled
