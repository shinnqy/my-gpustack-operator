{{- if .Values.cleanupOnUninstall }}
{{- /*
  卸载 hook 共用专用 ServiceAccount。跨命名空间清理、Worker 缩容和集群级资源回收需要相应授权，hook 完成后由 Helm 回收。
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpustack-operator.fullname" . }}-cleanup
  namespace: {{ include "gpustack-operator.namespace" . }}
  labels:
    {{- include "gpustack-operator.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete,post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpustack-operator.fullname" . }}-cleanup
  labels:
    {{- include "gpustack-operator.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete,post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "gpustack-operator.fullname" . }}-cleanup
    namespace: {{ include "gpustack-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
{{- end }}
