{{- if .Values.modelManager.enabled }}
{{- /*
  只提供节点端的内联临时 CSI 卷。podInfoOnMount 让 kubelet 将发起挂载的 Pod 命名空间交给插件用于授权。
*/}}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: model.csi.gpustack.ai
  labels:
    {{- include "gpustack-operator.modelManager.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
  fsGroupPolicy: None
{{- end }}
